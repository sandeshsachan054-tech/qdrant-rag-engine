<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a24; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; height: 85vh; background: #222230; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .chat-header { background: #2b2b3d; padding: 15px 20px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #333345; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #4f46e5; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background: #2d2d3f; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3d3d52; }
        .input-area { display: flex; padding: 15px; background: #2b2b3d; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #44445c; background: #1a1a24; color: white; outline: none; }
        button { padding: 12px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Ask AI About Candidate</div>
    <div class="chat-box" id="chatBox">
        <div class="message assistant">Hello! I am the candidate's AI assistant. Ask me about their skills, experience, or projects!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something (e.g., What are their top projects?)" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    let conversationHistory = [];

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // User message UI mein add karein
        appendMessage("user", text);
        conversationHistory.push({ role: "user", content: text });
        userInput.value = "";

        // Streaming assistant message container
        const assistantMsgDiv = appendMessage("assistant", "");

        try {
            const response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: conversationHistory })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let assistantReply = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                assistantReply += chunk;
                assistantMsgDiv.textContent = assistantReply;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            conversationHistory.push({ role: "assistant", content: assistantReply });

        } catch (error) {
            assistantMsgDiv.textContent = "Error connecting to backend.";
        }
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }
</script>

</body>
</html>
