<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandesh AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 820px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      padding: 20px;
      text-align: center;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    .chat-box {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .chat-box::-webkit-scrollbar {
      width: 6px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .msg {
      padding: 16px 22px;
      border-radius: 18px;
      max-width: 85%;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.25s ease-in-out;
    }

    /* Markdown styling inside bot bubble */
    .msg h1, .msg h2, .msg h3, .msg h4 {
      margin: 10px 0 6px 0;
      color: #38bdf8;
    }
    .msg p {
      margin-bottom: 8px;
    }
    .msg ul, .msg ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .msg li {
      margin-bottom: 4px;
    }
    .msg strong {
      color: #e2e8f0;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }

    .bot {
      align-self: flex-start;
      background: rgba(51, 65, 85, 0.95);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .input-form {
      display: flex;
      gap: 12px;
      padding: 18px 22px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      outline: none;
      background: rgba(30, 41, 59, 0.8);
      color: #f8fafc;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      padding: 14px 26px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="header-dot"></div>
      Sandesh AI Assistant
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hi! Ask me anything about my experience, technical skills, or projects.</div>
    </div>
    <form class="input-form" id="chatForm">
      <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Marked library for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
